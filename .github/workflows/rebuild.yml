# Weekly rebuild with the newest yt-dlp, monthly with a fresh Debian base for media-ffmpeg, and the
# manual "rebuild now" path for urgent extractor fixes (SPEC §17). Each build passes the image
# acceptance and end-to-end tests before it is pushed; deploy it with deploy.sh <tag>.
name: Rebuild

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays: newest yt-dlp
    - cron: '47 3 1 * *' # 1st of the month: also media-ffmpeg from scratch (Debian security updates)
  workflow_dispatch:
    inputs:
      ytdlp_version:
        description: yt-dlp version (empty for the newest on PyPI)
        required: false
      fresh_ffmpeg:
        description: Rebuild media-ffmpeg without cache
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Versions
        env:
          REQUESTED: ${{ inputs.ytdlp_version }}
        run: |
          version=${REQUESTED:-$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')}
          [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "unexpected yt-dlp version '$version'"; exit 1; }
          {
            echo "YTDLP_VERSION=$version"
            echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::12}-ytdlp$version"
          } >>"$GITHUB_ENV"
      - name: Build media-ffmpeg
        uses: docker/build-push-action@v6
        with:
          context: docker/ffmpeg
          tags: media-ffmpeg:ci
          load: true
          no-cache: ${{ github.event.schedule == '47 3 1 * *' || inputs.fresh_ffmpeg == true }}
          cache-from: type=gha,scope=media-ffmpeg
          cache-to: type=gha,mode=max,scope=media-ffmpeg
      - name: media-ffmpeg acceptance test
        run: docker/ffmpeg/test.sh media-ffmpeg:ci
      - name: End-to-end stack test with this yt-dlp
        run: FFMPEG_IMAGE=media-ffmpeg:ci YTDLP_VERSION="$YTDLP_VERSION" scripts/e2e.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push media-ffmpeg
        id: ffmpeg
        uses: docker/build-push-action@v6
        with:
          context: docker/ffmpeg
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/media-ffmpeg:n8.1.3-w1.9.5-${{ env.TAG }}
          cache-from: type=gha,scope=media-ffmpeg
      - name: Push media-service
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FFMPEG_IMAGE=${{ env.REGISTRY }}/media-ffmpeg@${{ steps.ffmpeg.outputs.digest }}
            YTDLP_VERSION=${{ env.YTDLP_VERSION }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/media-service:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: echo "Built media-service:$TAG (yt-dlp $YTDLP_VERSION). Deploy with deploy.sh $TAG." >>"$GITHUB_STEP_SUMMARY"
