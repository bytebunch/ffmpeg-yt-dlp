# Live tests against YouTube (SPEC §16): real metadata, playlist expansion, downloads, a then
# recipe, transcripts and comments with the pinned yt-dlp. Run by hand only: YouTube often refuses
# GitHub runners' IPs (BOT_CHECK), so the daily canary runs on the server (deploy/canary.sh,
# DEPLOY.md §4.10), from the IP that matters. A failure here that is not BOT_CHECK means an
# extractor broke; run the Rebuild workflow with a newer yt-dlp. Optional CANARY_PING_URL secret:
# pinged on success, "<url>/fail" on failure.
name: Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build media-ffmpeg
        uses: docker/build-push-action@v6
        with:
          context: docker/ffmpeg
          tags: media-ffmpeg:ci
          load: true
          cache-from: type=gha,scope=media-ffmpeg
      - name: Build the toolbox image
        run: docker build --build-arg FFMPEG_IMAGE=media-ffmpeg:ci -t media-dev:latest docker/dev
      - name: Install dependencies
        run: ./dev pnpm install --frozen-lockfile
      - name: Live tests against YouTube
        run: ./dev pnpm test:live
      - name: Ping
        if: always()
        env:
          PING_URL: ${{ secrets.CANARY_PING_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          [ -n "$PING_URL" ] || exit 0
          if [ "$OUTCOME" = success ]; then curl -fsS -m 10 --retry 3 "$PING_URL"; else curl -fsS -m 10 --retry 3 "$PING_URL/fail"; fi
