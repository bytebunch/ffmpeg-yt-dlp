# Host nginx in front of the bundled proxy (DEPLOY-QUICKSTART.md "TLS"): copy to
# /etc/nginx/sites-available/, set server_name, link it, then `certbot --nginx -d <name> --redirect`.
# Keep HTTP_BIND=127.0.0.1 (the default) so port 8085 is reachable only through this front, and
# set PUBLIC_BASE_URL to this front's address.
# Limits and timeouts are the bundled proxy's; this only adds TLS and passes everything through.

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;
    server_tokens off;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streams (MCP, job events, downloads) and tus uploads pass through unbuffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
