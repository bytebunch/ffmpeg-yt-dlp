# Host nginx vhost (DEPLOY.md §4.4): copy to /etc/nginx/sites-available/ and link it from
# sites-enabled; nginx/media-zones.conf goes to /etc/nginx/conf.d/. HTTP only, so `nginx -t`
# passes before a certificate exists; `certbot --nginx -d dl.<domain> --redirect` adds TLS.
# Set server_name, the upstream port (API_PORT) and client_max_body_size (MAX_UPLOAD_SIZE_MB).
# Keep the locations in step with nginx/proxy.conf.template (deploy/tests/nginx.sh checks).

upstream media_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ {
        limit_req zone=media_api burst=40 nodelay;
        proxy_pass http://media_api;
    }

    # Long-lived streams: MCP and job progress events.
    location /mcp {
        limit_req zone=media_api burst=40 nodelay;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://media_api;
    }
    location ~ ^/v1/jobs/[^/]+/events$ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://media_api;
    }

    # Signed downloads: the API checks the link and answers with X-Accel-Redirect;
    # nginx then streams the file from the internal location with Range support.
    location /d/ {
        limit_req zone=media_downloads burst=50 nodelay;
        proxy_pass http://media_api;
    }
    location /_files/ {
        internal;
        alias /mnt/media-files/;
    }

    # Resumable uploads (tus): streamed straight to the API.
    location /u/ {
        limit_req zone=media_uploads burst=20 nodelay;
        proxy_request_buffering off;
        client_max_body_size 4096m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://media_api;
    }

    location /docs {
        limit_req zone=media_api burst=40 nodelay;
        proxy_pass http://media_api;
    }
    location /oauth/ {
        limit_req zone=media_api burst=40 nodelay;
        proxy_pass http://media_api;
    }

    # Operational endpoints: add your IP/VPN and the uptime monitor's addresses.
    location ~ ^/(health|metrics)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://media_api;
    }

    location / {
        return 404;
    }
}
