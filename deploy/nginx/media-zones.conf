# Rate-limit zones for nginx/media.conf (DEPLOY.md §4.4): copy to /etc/nginx/conf.d/.
# Per client IP; the API also limits per API key (API_RATE_LIMIT_PER_MINUTE).
limit_req_zone $binary_remote_addr zone=media_api:10m rate=20r/s;
# tus PATCH requests, one per chunk.
limit_req_zone $binary_remote_addr zone=media_uploads:10m rate=10r/s;
# Signed links: players send a Range request per seek.
limit_req_zone $binary_remote_addr zone=media_downloads:10m rate=20r/s;
limit_req_status 429;
