# Media Service stack (SPEC §2, §17; DEPLOY.md). install.sh copies this file to /srv/media;
# settings come from .env next to it. Local changes belong in docker-compose.override.yml.
#   Profiles: local-db, local-redis (bundled Postgres/Redis), proxy (bundled nginx on HTTP_PORT).
name: ${COMPOSE_PROJECT_NAME:-media}

x-app: &app
  image: ${MEDIA_IMAGE:?MEDIA_IMAGE is not set}:${IMAGE_TAG:?IMAGE_TAG is not set}
  env_file: .env
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - ${MEDIA_FILES_PATH:-./files}:/data/files
    - ./inbox:/data/inbox:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: "5" }

services:
  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    restart: "no"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    <<: *app
    command: ["node", "dist/main.js"]
    # Published on localhost only: the bundled proxy or the host's nginx is the way in.
    ports: ["127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"]
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker-dl:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      WORKER_ROLE: download
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    # Running downloads get time to finish on deploys (DEPLOY.md §6).
    stop_grace_period: 5m

  worker-ff:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      WORKER_ROLE: ffmpeg
    volumes:
      - ${MEDIA_FILES_PATH:-./files}:/data/files
      - ./inbox:/data/inbox:ro
      - ./models:/models:ro
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    # Recipes are CPU-bound. 0 means no limit; the memory cap makes the kernel kill ffmpeg rather
    # than Postgres when a recipe runs away (DEPLOY.md §3).
    cpus: ${WORKER_FF_CPUS:-0}
    mem_limit: ${WORKER_FF_MEMORY:-0}
    stop_grace_period: 5m

  # YouTube PO tokens for yt-dlp's bgutil plugin (SPEC §7f), at YTDLP_POT_PROVIDER_URL. Keep the
  # tag equal to POT_PLUGIN_VERSION in the image.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:${POT_PROVIDER_TAG:-2.0.2}
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      # Reached by this alias, which exists on backend only: the egress firewall drops
      # container-to-container traffic on the egress network (DEPLOY.md §4.5).
      backend:
        aliases: [pot-backend]
      egress: {}
    restart: unless-stopped
    healthcheck:
      # No shell in the image: node itself checks /ping.
      test: ["CMD", "/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  # Nightly pg_dump into ./backups, 14 days kept (DEPLOY.md §4.10); idle with BACKUP_ENABLED=false.
  # Same image as the bundled database, so pg_dump matches its version.
  backup:
    image: postgres:17-alpine
    command: ["/usr/local/bin/media-backup", "schedule"]
    env_file: .env
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./backup.sh:/usr/local/bin/media-backup:ro
      - ./backups:/backups
    # egress only for BACKUP_PING_URL.
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  postgres:
    image: postgres:17-alpine
    profiles: [local-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytdlp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    volumes:
      - ${PGDATA_PATH:-./pgdata}:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  redis:
    image: redis:7-alpine
    profiles: [local-redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_PATH:-./redis}:/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  proxy:
    image: nginx:1.29-alpine
    profiles: [proxy]
    environment:
      API_PORT: ${API_PORT:-3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-4096}
    # This server only unless HTTP_BIND says otherwise; nginx listens on 8080 inside the container.
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8085}:8080"]
    volumes:
      - ./nginx/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MEDIA_FILES_PATH:-./files}:/data/files:ro
    networks: [backend, edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

networks:
  # Containers talk to each other here; no route out.
  backend:
    internal: true
    ipam:
      config: [{ subnet: 172.31.0.0/24 }]
  # The only way out for containers that fetch caller URLs; filtered by the host (DEPLOY.md §4.5).
  egress:
    driver_opts:
      com.docker.network.bridge.name: br-media-egress
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  # Published port of the bundled proxy.
  edge: {}
